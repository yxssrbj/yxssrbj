name: Weekly contributions chart

on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/update_chart.py
      - .github/workflows/weekly-chart.yml
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate chart
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_chart.py
      - name: Commit chart when data changes
        run: |
          git add assets/contributions-per-week.svg
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'Profile: update weekly contributions chart'
            git push
          fi
